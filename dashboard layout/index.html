<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard Layout</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>Menu</h2>
      <nav class="nav">
        <a href="#">Dashboard</a>
        <a href="#">Analytics</a>
        <a href="#">Reports</a>
        <a href="#">Settings</a>
      </nav>
    </aside>
    <main class="main">

      <header class="header">
        <h1>Dashboard Layout</h1>
      </header>

      <section class="content">
        <div class="dashboard-grid">
          <div class="stats-row">
            <div class="card stat-card">Users: 1200</div>
            <div class="card stat-card">Sales: ₹75,000</div>
            <div class="card stat-card">Visitors: 5400</div>
            <div class="card stat-card">Bounce Rate: 32%</div>
          </div>
          <div class="cards-row">
            <div class="card">Card 1 Nested Grid</div>
            <div class="card">Card 2 Responsive</div>
            <div class="card">Card 3 Large</div>
          </div>
          <div class="cards-row">
            <div class="card">Card 4 Medium</div>
            <div class="card">Card 5 Hard UI</div>
            <div class="card">Card 6 CSS Practice</div>
          </div>

        </div>
      </section>

    </main>

  </div>
</body>
</html>
